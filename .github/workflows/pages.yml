name: pages

# Build the email previews and publish them to GitHub Pages on every push to main.
# dist/ is NOT committed — it is produced here and deployed, so the live preview is always
# rebuilt from source (never stale, no build artifacts in git).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate the deploy on quality: typecheck + build + snapshot tests must pass.
      - run: npm run validate
      # Stage dist/ + the ASSET FILES ONLY, so the emails' repo-relative paths (../src/…) resolve on
      # Pages. This used to `cp -r src _site/src`, which published every .ts/.njk source file — copy,
      # schemas, merge-key names and office addresses — to a URL that is public even when the repo is
      # private. The gallery only ever needs the images, so only the images ship.
      # A root redirect sends visitors from / to the /dist/ preview gallery.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r dist _site/dist
          find src -type d -name assets -exec sh -c '
            for dir do
              target="_site/$dir"
              mkdir -p "$target"
              cp -r "$dir/." "$target/"
            done' sh {} +
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=./dist/">' > _site/index.html
          echo "Published asset files:"; find _site/src -type f | sort
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
