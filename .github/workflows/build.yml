name: build

# CI for feature branches + PRs. main is validated + deployed by pages.yml, so it's excluded
# here to avoid running the same checks twice.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # typecheck + build (MJML + key governance) + snapshot tests — all fail CI on error.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
