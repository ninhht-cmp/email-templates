name: build

# CI for feature branches + PRs. main is validated + deployed by pages.yml, so it's excluded
# here to avoid running the same checks twice.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same gate as main. `npm run validate` runs: Biome (format + lint) → typecheck → build (MJML,
      # key governance, breakpoint + fluid-hybrid invariants, opt-out check) → email-client compat
      # lint → tests. It is one command on purpose: the compat lint used to run ONLY on main, so a
      # client-compatibility error passed PR review and first went red after the merge, on the deploy.
      - run: npm run validate
